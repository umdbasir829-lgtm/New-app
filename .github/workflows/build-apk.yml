          ls -lh app/debug.keystore
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk ../ShieldGuard-AppLock.apk

      - name: Upload ShieldGuard-AppLock.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGuard-AppLock
          path: ShieldGuard-AppLock.apk

      - name: Publish Direct APK Release
        working-directory: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' android-project/app/build.gradle.kts | sed -E 's/.*"([^"]+)"/\1/')
          VER_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' android-project/app/build.gradle.kts | grep -oE '[0-9]+')
          TAG="v${VER_NAME}-b${VER_CODE}.${{ github.run_number }}"
          gh release create "$TAG" ShieldGuard-AppLock.apk \
            --title "ShieldGuard AppLock v${VER_NAME}" \
            --notes "Automated Android APK build v${VER_NAME} (Build ${VER_CODE})"
